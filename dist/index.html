<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4dfb3">
  <meta name="description" content="Cradle ceremony invitation for Muhammed Aizen Thaufeek on 27 September 2026.">
  <title>Muhammed Aizen Thaufeek · Cradle Ceremony</title>
  <link rel="preload" href="cradle-ceremony.mp4" as="video" type="video/mp4">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff8e9'/%3E%3Cpath d='M43 12a22 22 0 1 0 9 40A25 25 0 0 1 43 12Z' fill='%23b57922'/%3E%3Cpath d='m47 18 2 5 5 .4-4 3.5 1.4 5.1-4.4-3-4.4 3 1.4-5.1-4-3.5 5-.4Z' fill='%23d9a448'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --gold: #9a6014; --deep: #533515; --cream: #fff8e9; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #ead09b; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--deep);
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,.95), transparent 40%),
        linear-gradient(135deg, #dfbd7b, #fff5d9 48%, #c99842);
    }
    .invitation {
      position: relative;
      width: min(100vw, calc(100svh * .5625));
      height: min(100svh, calc(100vw * 1.7777778));
      overflow: hidden;
      background: var(--cream);
      box-shadow: 0 28px 80px rgba(76, 43, 5, .34);
      isolation: isolate;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .glow {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.25) 48%, transparent 62%);
      transform: translateX(-120%);
      animation: shimmer 7s ease-in-out 1.2s infinite;
      mix-blend-mode: screen;
    }
    .location {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px));
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      min-height: 48px;
      padding: .7rem 1.15rem;
      border: 1px solid rgba(133, 83, 14, .46);
      border-radius: 999px;
      color: #56330a;
      background: rgba(255, 248, 232, .9);
      box-shadow: 0 8px 26px rgba(82, 49, 7, .22), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-decoration: none;
      font: 700 1rem/1 system-ui, -apple-system, sans-serif;
      letter-spacing: .01em;
      white-space: nowrap;
      animation: arrive .7s ease 7.7s both, breathe 2.8s ease-in-out 8.5s infinite;
    }
    .location svg { width: 1.2rem; height: 1.2rem; fill: #a86d1d; flex: none; }
    .location:hover { background: #fffaf0; transform: translateX(-50%) translateY(-2px); }
    .location:focus-visible { outline: 3px solid #6b4511; outline-offset: 3px; }
    .replay {
      position: absolute;
      z-index: 3;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(133,83,14,.32);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #6f4610;
      background: rgba(255,248,232,.78);
      backdrop-filter: blur(10px);
      cursor: pointer;
      opacity: 0;
      animation: fade-in .5s ease 9.5s forwards;
    }
    .replay svg { width: 21px; fill: currentColor; }
    @keyframes shimmer { 0%, 18% { transform: translateX(-120%); } 48%, 100% { transform: translateX(120%); } }
    @keyframes arrive { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes fade-in { to { opacity: 1; } }
    @keyframes breathe { 50% { box-shadow: 0 10px 30px rgba(82,49,7,.3), 0 0 0 7px rgba(255,248,232,.24); } }
    @media (min-aspect-ratio: 9/16) { .invitation { border-radius: 18px; } }
    @media (prefers-reduced-motion: reduce) {
      .glow { display: none; }
      .location, .replay { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="invitation" aria-label="Cradle ceremony invitation">
    <video id="invitationVideo" autoplay muted playsinline poster="poster.jpg" aria-label="Animated cradle ceremony invitation">
      <source src="cradle-ceremony.mp4" type="video/mp4">
    </video>
    <div class="glow" aria-hidden="true"></div>
    <a class="location" href="https://maps.google.com/?q=10.131840,76.462669" target="_blank" rel="noopener" aria-label="Open the ceremony location in Google Maps">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/></svg>
      Open location
    </a>
    <button class="replay" id="replay" type="button" aria-label="Replay invitation">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.1A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h8V3l-3.35 3.35Z"/></svg>
    </button>
  </main>
  <script>
    const video = document.querySelector('#invitationVideo');
    const replay = document.querySelector('#replay');
    video.addEventListener('ended', () => video.pause());
    replay.addEventListener('click', () => { video.currentTime = 0; video.play(); });
  </script>
</body>
</html>
